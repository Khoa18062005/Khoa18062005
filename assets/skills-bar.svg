<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="barGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tipGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bar1Clip"><rect x="200" y="73" width="450" height="24" rx="4"/></clipPath>
    <clipPath id="bar2Clip"><rect x="200" y="118" width="450" height="24" rx="4"/></clipPath>
    <clipPath id="bar3Clip"><rect x="200" y="163" width="450" height="24" rx="4"/></clipPath>
    <clipPath id="bar4Clip"><rect x="200" y="208" width="450" height="24" rx="4"/></clipPath>
    <clipPath id="bar5Clip"><rect x="200" y="253" width="450" height="24" rx="4"/></clipPath>
    <clipPath id="bar6Clip"><rect x="200" y="298" width="450" height="24" rx="4"/></clipPath>
  </defs>

  <style>
    @keyframes fillBar1 { 0% { width: 0; } 100% { width: 405px; } }
    @keyframes fillBar2 { 0% { width: 0; } 100% { width: 382px; } }
    @keyframes fillBar3 { 0% { width: 0; } 100% { width: 360px; } }
    @keyframes fillBar4 { 0% { width: 0; } 100% { width: 382px; } }
    @keyframes fillBar5 { 0% { width: 0; } 100% { width: 360px; } }
    @keyframes fillBar6 { 0% { width: 0; } 100% { width: 292px; } }

    @keyframes fadeInLabel { 0%, 50% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes tipPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    @keyframes gridFade { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.08; } }

    .bar1 { animation: fillBar1 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s both; }
    .bar2 { animation: fillBar2 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s both; }
    .bar3 { animation: fillBar3 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s both; }
    .bar4 { animation: fillBar4 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.2s both; }
    .bar5 { animation: fillBar5 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.5s both; }
    .bar6 { animation: fillBar6 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.8s both; }

    .pct1 { animation: fadeInLabel 1.5s ease 0.3s both; }
    .pct2 { animation: fadeInLabel 1.5s ease 0.6s both; }
    .pct3 { animation: fadeInLabel 1.5s ease 0.9s both; }
    .pct4 { animation: fadeInLabel 1.5s ease 1.2s both; }
    .pct5 { animation: fadeInLabel 1.5s ease 1.5s both; }
    .pct6 { animation: fadeInLabel 1.5s ease 1.8s both; }

    .tip-glow { animation: tipPulse 2s ease-in-out infinite; }
    .grid-line { animation: gridFade 6s ease-in-out infinite; }
    .skill-label { font-family: 'Courier New', monospace; font-size: 12px; fill: #a0aec0; }
    .pct-label { font-family: 'Courier New', monospace; font-size: 11px; fill: #14b8a6; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="800" height="350" fill="#0d1117" rx="6"/>

  <!-- Faint grid lines -->
  <g class="grid-line" stroke="#14b8a6" stroke-width="0.5" opacity="0.05">
    <!-- Vertical grid lines at percentage marks -->
    <line x1="200" y1="60" x2="200" y2="330"/>
    <line x1="290" y1="60" x2="290" y2="330"/>
    <line x1="380" y1="60" x2="380" y2="330"/>
    <line x1="470" y1="60" x2="470" y2="330"/>
    <line x1="560" y1="60" x2="560" y2="330"/>
    <line x1="650" y1="60" x2="650" y2="330"/>
    <!-- Horizontal lines -->
    <line x1="200" y1="60" x2="650" y2="60"/>
    <line x1="200" y1="105" x2="650" y2="105"/>
    <line x1="200" y1="150" x2="650" y2="150"/>
    <line x1="200" y1="195" x2="650" y2="195"/>
    <line x1="200" y1="240" x2="650" y2="240"/>
    <line x1="200" y1="285" x2="650" y2="285"/>
    <line x1="200" y1="330" x2="650" y2="330"/>
  </g>

  <!-- Percentage scale markers at bottom -->
  <text x="200" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">0%</text>
  <text x="290" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">20%</text>
  <text x="380" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">40%</text>
  <text x="470" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">60%</text>
  <text x="560" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">80%</text>
  <text x="650" y="345" font-family="'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle">100%</text>

  <!-- Title -->
  <text x="30" y="35" font-family="'Courier New', monospace" font-size="20" fill="#06b6d4" font-weight="bold">⚡ Power Levels</text>
  <line x1="30" y1="50" x2="770" y2="50" stroke="#14b8a6" stroke-width="0.5" opacity="0.2"/>

  <!-- Bar 1: JavaScript/TypeScript 90% -->
  <text x="195" y="90" text-anchor="end" class="skill-label">JavaScript/TS</text>
  <rect x="200" y="73" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar1Clip)">
    <rect x="200" y="73" height="24" rx="4" fill="url(#barGrad2)" class="bar1" filter="url(#barGlow)"/>
  </g>
  <circle cx="605" cy="85" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct1" opacity="0"/>
  <text x="618" y="89" class="pct-label pct1">90%</text>

  <!-- Bar 2: Python 85% -->
  <text x="195" y="135" text-anchor="end" class="skill-label">Python</text>
  <rect x="200" y="118" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar2Clip)">
    <rect x="200" y="118" height="24" rx="4" fill="url(#barGrad2)" class="bar2" filter="url(#barGlow)"/>
  </g>
  <circle cx="582" cy="130" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct2" opacity="0" style="animation-delay:0.3s"/>
  <text x="595" y="134" class="pct-label pct2">85%</text>

  <!-- Bar 3: Java/Spring 80% -->
  <text x="195" y="180" text-anchor="end" class="skill-label">Java/Spring</text>
  <rect x="200" y="163" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar3Clip)">
    <rect x="200" y="163" height="24" rx="4" fill="url(#barGrad2)" class="bar3" filter="url(#barGlow)"/>
  </g>
  <circle cx="560" cy="175" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct3" opacity="0" style="animation-delay:0.6s"/>
  <text x="573" y="179" class="pct-label pct3">80%</text>

  <!-- Bar 4: React/Next.js 85% -->
  <text x="195" y="225" text-anchor="end" class="skill-label">React/Next.js</text>
  <rect x="200" y="208" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar4Clip)">
    <rect x="200" y="208" height="24" rx="4" fill="url(#barGrad2)" class="bar4" filter="url(#barGlow)"/>
  </g>
  <circle cx="582" cy="220" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct4" opacity="0" style="animation-delay:0.9s"/>
  <text x="595" y="224" class="pct-label pct4">85%</text>

  <!-- Bar 5: Database (SQL/NoSQL) 80% -->
  <text x="195" y="270" text-anchor="end" class="skill-label">Database SQL/NoSQL</text>
  <rect x="200" y="253" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar5Clip)">
    <rect x="200" y="253" height="24" rx="4" fill="url(#barGrad2)" class="bar5" filter="url(#barGlow)"/>
  </g>
  <circle cx="560" cy="265" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct5" opacity="0" style="animation-delay:1.2s"/>
  <text x="573" y="269" class="pct-label pct5">80%</text>

  <!-- Bar 6: DevOps & Cloud 65% -->
  <text x="195" y="315" text-anchor="end" class="skill-label">DevOps &amp; Cloud</text>
  <rect x="200" y="298" width="450" height="24" rx="4" fill="#1a2332" opacity="0.6"/>
  <g clip-path="url(#bar6Clip)">
    <rect x="200" y="298" height="24" rx="4" fill="url(#barGrad2)" class="bar6" filter="url(#barGlow)"/>
  </g>
  <circle cx="492" cy="310" r="6" fill="#14b8a6" filter="url(#tipGlow)" class="tip-glow pct6" opacity="0" style="animation-delay:1.5s"/>
  <text x="505" y="314" class="pct-label pct6">65%</text>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="348" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.1" rx="6"/>
</svg>
