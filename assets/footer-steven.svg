<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 190" width="100%" height="190" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Rich Beach City Twilight to Sunset Gradient -->
    <linearGradient id="twilightSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090312" />
      <stop offset="35%" stop-color="#18092e" />
      <stop offset="65%" stop-color="#380d4a" />
      <stop offset="85%" stop-color="#661453" />
      <stop offset="100%" stop-color="#8f1c5c" />
    </linearGradient>

    <!-- Rose Quartz Shield Radial Gradient (Matching Header & Hình 5) -->
    <radialGradient id="roseShieldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4ec" />
      <stop offset="25%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGoldFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Waves Gradients (Compact at bottom) -->
    <linearGradient id="waveGradDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a0f3d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#701a54" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4a0f3d" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="waveGradMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d174d" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="shoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0317" />
      <stop offset="50%" stop-color="#150626" />
      <stop offset="100%" stop-color="#0b0317" />
    </linearGradient>

    <!-- Shield Ambient Aura -->
    <radialGradient id="shieldAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Horizontal Resonance Filament Gradient -->
    <linearGradient id="filamentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0" />
      <stop offset="25%" stop-color="#2563eb" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveFlow2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(30px); }
      100% { transform: translateX(0px); }
    }
    @keyframes shieldPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 14px rgba(244, 63, 94, 0.75));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 26px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 10px #fde047);
      }
    }
    @keyframes gemBobUp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes gemBobDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes twinkleSoft {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes floatPetal {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      25% { opacity: 0.85; }
      75% { opacity: 0.85; }
      100% { transform: translate(50px, -70px) rotate(140deg); opacity: 0; }
    }

    .wave-back { animation: waveFlow1 8s ease-in-out infinite; }
    .wave-mid { animation: waveFlow2 10s ease-in-out infinite; }
    .shield-center { transform-origin: 475px 84px; animation: shieldPulse 5s ease-in-out infinite; }
    
    /* Dedicated inner-group bobbing animations (safe from CSS transform overwrite) */
    .bob-1 { animation: gemBobUp 3.6s ease-in-out infinite; }
    .bob-2 { animation: gemBobDown 4.2s ease-in-out infinite 0.4s; }
    .bob-3 { animation: gemBobUp 3.8s ease-in-out infinite 0.8s; }
    .bob-4 { animation: gemBobDown 4.4s ease-in-out infinite 1.2s; }
    .bob-5 { animation: gemBobUp 4.0s ease-in-out infinite 1.6s; }
    .bob-6 { animation: gemBobDown 3.7s ease-in-out infinite 2.0s; }

    .twinkle-1 { animation: twinkleSoft 3s ease-in-out infinite; }
    .twinkle-2 { animation: twinkleSoft 4s ease-in-out infinite 1.5s; }
    .petal-float1 { animation: floatPetal 8s linear infinite; }
    .petal-float2 { animation: floatPetal 10s linear infinite 3s; }
  </style>

  <!-- Sky Canvas with Sunset Twilight -->
  <rect width="950" height="190" rx="14" fill="url(#twilightSunset)" stroke="#2b0e45" stroke-width="1.5"/>

  <!-- Starry Background Grid & Twinkling Constellations -->
  <g fill="#ffffff">
    <circle cx="50" cy="22" r="1.5" class="twinkle-1" opacity="0.85"/>
    <circle cx="110" cy="42" r="1.2" class="twinkle-2" opacity="0.6"/>
    <circle cx="190" cy="18" r="1.8" class="twinkle-1" opacity="0.9"/>
    <circle cx="280" cy="35" r="1.2" class="twinkle-2" opacity="0.7"/>
    <circle cx="360" cy="18" r="1.5" class="twinkle-1" opacity="0.8"/>
    <circle cx="590" cy="20" r="1.5" class="twinkle-2" opacity="0.75"/>
    <circle cx="680" cy="38" r="1.2" class="twinkle-1" opacity="0.6"/>
    <circle cx="760" cy="18" r="1.8" class="twinkle-2" opacity="0.9"/>
    <circle cx="835" cy="40" r="1.4" class="twinkle-1" opacity="0.7"/>
    <circle cx="905" cy="24" r="1.5" class="twinkle-2" opacity="0.8"/>
  </g>

  <!-- Left: Beach City Ancient Crystal Temple Silhouette (Obsidian statue) -->
  <path d="M 0 170 L 0 120 Q 35 112 65 116 Q 85 96 108 100 Q 120 84 138 92 Q 155 106 172 118 Q 192 134 215 170 Z" fill="#140626" opacity="0.7"/>

  <!-- Right: Natural Coastal Hill Silhouette -->
  <path d="M 720 170 Q 780 135 830 130 Q 880 125 950 115 L 950 170 Z" fill="#140626" opacity="0.7"/>

  <!-- Lowered Waves (Compact at bottom) -->
  <!-- Wave Layer 1 (Back) -->
  <path class="wave-back" fill="url(#waveGradDeep)"
        d="M -100 152 Q 140 144 380 150 T 860 146 T 1300 150 L 1300 190 L -100 190 Z" />

  <!-- Wave Layer 2 (Middle with glowing seafoam edge) -->
  <path class="wave-mid" fill="url(#waveGradMid)"
        stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.85"
        d="M -100 162 Q 180 154 460 160 T 940 156 T 1400 160 L 1400 190 L -100 190 Z" />

  <!-- Wave Layer 3 (Foreground shore line) -->
  <path fill="url(#shoreGrad)" stroke="#fda4af" stroke-width="1.5" stroke-opacity="0.9"
        d="M -50 172 Q 200 165 475 169 T 1000 166 L 1000 190 L -50 190 Z" />

  <!-- Subtle Horizontal Starlight Filament connecting the row -->
  <line x1="170" y1="84" x2="780" y2="84" stroke="url(#filamentGrad)" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.45"/>

  <!-- Center Ambient Radiant Halo behind Shield -->
  <circle cx="475" cy="84" r="85" fill="url(#shieldAmbient)"/>

  <!-- ═══════════════ HORIZONTAL CONSTELLATION: SHIELD CENTER ═══════════════ -->

  <!-- [LEFT 1] Peridot (Lime Inverted Triangle, Far Left) -->
  <g transform="translate(200, 84)">
    <g class="bob-1">
      <g filter="url(#softGlow)">
        <polygon points="-11,-11 11,-11 0,11" fill="#84cc16" stroke="#ecfccb" stroke-width="1.6"/>
        <polygon points="-6,-8 6,-8 0,4" fill="#bef264"/>
        <polygon points="-11,-11 -6,-8 0,4 0,11" fill="#65a30d" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- [LEFT 2] Sapphire (Blue Triangle, Mid Left) -->
  <g transform="translate(285, 84)">
    <g class="bob-2">
      <g filter="url(#softGlow)">
        <polygon points="0,-11 11,8 -11,8" fill="#2563eb" stroke="#93c5fd" stroke-width="1.6"/>
        <polygon points="0,-11 0,8 11,8" fill="#1d4ed8" opacity="0.8"/>
        <polygon points="0,-11 -6,3 0,8" fill="#60a5fa" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- [LEFT 3] Ruby (Red Diamond Square, Inner Left) -->
  <g transform="translate(370, 84)">
    <g class="bob-3">
      <g filter="url(#softGlow)">
        <rect x="-10" y="-10" width="20" height="20" rx="3" transform="rotate(45)" fill="#dc2626" stroke="#fca5a5" stroke-width="1.6"/>
        <polygon points="0,-13 7,0 0,13" fill="#ef4444" opacity="0.75"/>
        <polygon points="0,-13 -7,0 0,13" fill="#b91c1c" opacity="0.75"/>
      </g>
    </g>
  </g>

  <!-- [CENTER] Steven's Rose Quartz Shield (Prominent, Central Anchor) -->
  <g class="shield-center">
    <!-- Outer Shield Body -->
    <circle cx="475" cy="84" r="44" fill="url(#roseShieldBg)" stroke="#fbcfe8" stroke-width="3"/>

    <!-- Rose's Thorny Spiral / Dashed Ring Motif -->
    <circle cx="475" cy="84" r="36" fill="none" stroke="#be185d" stroke-width="2.2" stroke-dasharray="9 5" opacity="0.8"/>
    
    <!-- Inner Rose Circle -->
    <circle cx="475" cy="84" r="28" fill="#fda4af" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>

    <!-- Steven's Iconic Golden Star -->
    <polygon points="475,60 481,76 498,77 485,87 490,103 475,93 460,103 465,87 452,77 469,76"
             fill="url(#starGoldFooter)" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- [RIGHT 1] Rose Quartz (Faceted Pink Diamond, Inner Right) -->
  <g transform="translate(580, 84)">
    <g class="bob-4">
      <g filter="url(#softGlow)">
        <polygon points="0,-13 13,-4 9,12 -9,12 -13,-4" fill="#f43f5e" stroke="#fbcfe8" stroke-width="1.6"/>
        <polygon points="0,-13 0,12 9,12 13,-4" fill="#fb7185" opacity="0.85"/>
        <polygon points="0,-13 -9,12 0,12" fill="#fda4af" opacity="0.95"/>
      </g>
    </g>
  </g>

  <!-- [RIGHT 2] Pearl (Iridescent Cyan/White Oval, Mid Right) -->
  <g transform="translate(665, 84)">
    <g class="bob-5">
      <g filter="url(#softGlow)">
        <ellipse cx="0" cy="0" rx="9.5" ry="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8"/>
        <ellipse cx="-2.5" cy="-3.5" rx="3" ry="6" fill="#ffffff" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- [RIGHT 3] Amethyst (Faceted Purple Hexagon, Far Right) -->
  <g transform="translate(750, 84)">
    <g class="bob-6">
      <g filter="url(#softGlow)">
        <polygon points="0,-12 12,-6 12,6 0,12 -12,6 -12,-6" fill="#9333ea" stroke="#d8b4fe" stroke-width="1.6"/>
        <polygon points="0,-12 0,12 12,6 12,-6" fill="#a855f7" opacity="0.85"/>
        <polygon points="0,0 -12,6 0,-12" fill="#c084fc" opacity="0.95"/>
      </g>
    </g>
  </g>

  <!-- Floating Rose Petals rising into the cosmos -->
  <g fill="#f472b6" opacity="0.75" filter="url(#softGlow)">
    <ellipse cx="440" cy="150" rx="5" ry="2.8" class="petal-float1"/>
    <ellipse cx="510" cy="142" rx="4.5" ry="2.5" class="petal-float2"/>
  </g>
</svg>
