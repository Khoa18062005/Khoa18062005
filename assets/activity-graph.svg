<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    /* ECG line draws from left to right. Total path length ~1600 for 2 heartbeat cycles across 800px */
    @keyframes drawLine {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawLine2 {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulseDot { 0%, 100% { r: 3; opacity: 0.3; } 50% { r: 6; opacity: 0.8; } }
    @keyframes pulseDot2 { 0%, 100% { r: 3; opacity: 0.2; } 50% { r: 5; opacity: 0.6; } }
    @keyframes gridPulse { 0%, 100% { opacity: 0.03; } 50% { opacity: 0.06; } }
    @keyframes fadeLoop { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    @keyframes statusBlink { 0%, 40% { fill: #14b8a6; } 50%, 90% { fill: #22c55e; } 100% { fill: #14b8a6; } }

    .ecg-line {
      stroke-dasharray: 1600;
      animation: drawLine 4s linear infinite;
    }
    .ecg-trail {
      stroke-dasharray: 1600;
      animation: drawLine2 4s linear infinite;
      animation-delay: -0.1s;
    }
    .cursor-blink { animation: blink 1s step-end infinite; }
    .pulse-dot { animation: pulseDot 4s ease-in-out infinite; }
    .pulse-dot2 { animation: pulseDot2 4s ease-in-out infinite; animation-delay: 2s; }
    .grid { animation: gridPulse 5s ease-in-out infinite; }
    .status-text { animation: fadeLoop 3s ease-in-out infinite; }
    .status-dot { animation: statusBlink 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="200" fill="#0a0e17" rx="4"/>

  <!-- Grid lines (medical monitor style) -->
  <g class="grid" stroke="#14b8a6" stroke-width="0.5" opacity="0.04">
    <!-- Major grid -->
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="25" x2="800" y2="25"/>
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="175" x2="800" y2="175"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="0" x2="0" y2="200"/><line x1="25" y1="0" x2="25" y2="200"/>
    <line x1="50" y1="0" x2="50" y2="200"/><line x1="75" y1="0" x2="75" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/><line x1="125" y1="0" x2="125" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/><line x1="175" y1="0" x2="175" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/><line x1="225" y1="0" x2="225" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/><line x1="275" y1="0" x2="275" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/><line x1="325" y1="0" x2="325" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/><line x1="375" y1="0" x2="375" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/><line x1="425" y1="0" x2="425" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/><line x1="475" y1="0" x2="475" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/><line x1="525" y1="0" x2="525" y2="200"/>
    <line x1="550" y1="0" x2="550" y2="200"/><line x1="575" y1="0" x2="575" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/><line x1="625" y1="0" x2="625" y2="200"/>
    <line x1="650" y1="0" x2="650" y2="200"/><line x1="675" y1="0" x2="675" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/><line x1="725" y1="0" x2="725" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/><line x1="775" y1="0" x2="775" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- Fine grid (smaller squares) -->
  <g class="grid" stroke="#14b8a6" stroke-width="0.3" opacity="0.02">
    <line x1="0" y1="12.5" x2="800" y2="12.5"/><line x1="0" y1="37.5" x2="800" y2="37.5"/>
    <line x1="0" y1="62.5" x2="800" y2="62.5"/><line x1="0" y1="87.5" x2="800" y2="87.5"/>
    <line x1="0" y1="112.5" x2="800" y2="112.5"/><line x1="0" y1="137.5" x2="800" y2="137.5"/>
    <line x1="0" y1="162.5" x2="800" y2="162.5"/><line x1="0" y1="187.5" x2="800" y2="187.5"/>
  </g>

  <!-- Center baseline reference -->
  <line x1="0" y1="115" x2="800" y2="115" stroke="#14b8a6" stroke-width="0.3" opacity="0.08"/>

  <!--
    ECG heartbeat path - 2 full heartbeat cycles across 800px width
    Each cycle: flat → small P wave → flat → sharp QRS complex → flat → T wave → flat
    Baseline at y=115
  -->

  <!-- Glow trail (slightly behind) -->
  <path class="ecg-trail"
    d="M 0,115
       L 30,115 L 40,115 L 50,108 L 60,115 L 75,115
       L 90,115 L 95,115
       L 100,112 L 105,120 L 110,50 L 115,155 L 120,95 L 125,115
       L 140,115 L 160,115
       L 170,105 L 185,100 L 200,115
       L 230,115 L 280,115 L 290,115
       L 310,115 L 320,115 L 330,108 L 340,115 L 355,115
       L 370,115 L 375,115
       L 380,112 L 385,120 L 390,48 L 395,158 L 400,93 L 405,115
       L 420,115 L 440,115
       L 450,105 L 465,98 L 480,115
       L 510,115 L 560,115 L 570,115
       L 590,115 L 600,115 L 610,108 L 620,115 L 635,115
       L 650,115 L 655,115
       L 660,112 L 665,120 L 670,52 L 675,155 L 680,96 L 685,115
       L 700,115 L 720,115
       L 730,106 L 745,100 L 760,115
       L 800,115"
    fill="none" stroke="#14b8a6" stroke-width="4" opacity="0.15" filter="url(#lineGlow)"/>

  <!-- Main ECG line -->
  <path class="ecg-line"
    d="M 0,115
       L 30,115 L 40,115 L 50,108 L 60,115 L 75,115
       L 90,115 L 95,115
       L 100,112 L 105,120 L 110,50 L 115,155 L 120,95 L 125,115
       L 140,115 L 160,115
       L 170,105 L 185,100 L 200,115
       L 230,115 L 280,115 L 290,115
       L 310,115 L 320,115 L 330,108 L 340,115 L 355,115
       L 370,115 L 375,115
       L 380,112 L 385,120 L 390,48 L 395,158 L 400,93 L 405,115
       L 420,115 L 440,115
       L 450,105 L 465,98 L 480,115
       L 510,115 L 560,115 L 570,115
       L 590,115 L 600,115 L 610,108 L 620,115 L 635,115
       L 650,115 L 655,115
       L 660,112 L 665,120 L 670,52 L 675,155 L 680,96 L 685,115
       L 700,115 L 720,115
       L 730,106 L 745,100 L 760,115
       L 800,115"
    fill="none" stroke="url(#ecgGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)"/>

  <!-- Pulse circles at peak points (R-waves) -->
  <circle cx="110" cy="50" r="4" fill="#06b6d4" filter="url(#pulseGlow)" class="pulse-dot" opacity="0.4"/>
  <circle cx="390" cy="48" r="4" fill="#06b6d4" filter="url(#pulseGlow)" class="pulse-dot2" opacity="0.4"/>
  <circle cx="670" cy="52" r="4" fill="#06b6d4" filter="url(#pulseGlow)" class="pulse-dot" opacity="0.4" style="animation-delay:1s"/>

  <!-- Small pulse rings at S-wave valleys -->
  <circle cx="115" cy="155" r="3" fill="none" stroke="#14b8a6" stroke-width="0.5" class="pulse-dot" opacity="0.2"/>
  <circle cx="395" cy="158" r="3" fill="none" stroke="#14b8a6" stroke-width="0.5" class="pulse-dot2" opacity="0.2"/>
  <circle cx="675" cy="155" r="3" fill="none" stroke="#14b8a6" stroke-width="0.5" class="pulse-dot" opacity="0.2" style="animation-delay:1s"/>

  <!-- Text overlay: "// coding activity: ACTIVE" -->
  <g class="status-text">
    <text x="25" y="28" font-family="'Courier New', monospace" font-size="13" fill="#4a5568" opacity="0.5">
      <tspan fill="#4a5568">// </tspan>
      <tspan fill="#6b7280">coding activity: </tspan>
      <tspan class="status-dot">ACTIVE</tspan>
      <tspan class="cursor-blink" fill="#14b8a6"> █</tspan>
    </text>
  </g>

  <!-- Top right info display -->
  <g opacity="0.4">
    <text x="770" y="28" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#0ea5e9">♥ BPM: 72</text>
    <text x="770" y="42" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#4a5568">signal: strong</text>
  </g>

  <!-- Bottom left info -->
  <text x="25" y="190" font-family="'Courier New', monospace" font-size="9" fill="#4a5568" opacity="0.3">sys.monitor.v2.1 | uptime: ∞</text>

  <!-- Bottom right info -->
  <text x="770" y="190" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#4a5568" opacity="0.3">refresh: 60fps | latency: 0ms</text>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="198" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.1" rx="4"/>

  <!-- Corner indicators -->
  <polyline points="5,12 5,5 12,5" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
  <polyline points="788,5 795,5 795,12" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <polyline points="5,188 5,195 12,195" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <polyline points="788,195 795,195 795,188" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
</svg>
