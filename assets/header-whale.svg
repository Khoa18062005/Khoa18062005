<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Deep Ocean Gradient -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="35%" stop-color="#05192d" />
      <stop offset="70%" stop-color="#030f1c" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>

    <!-- Sun rays through water -->
    <linearGradient id="sunRay" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sunRay2" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </linearGradient>

    <!-- Whale Gradient -->
    <linearGradient id="whaleBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="75%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="whaleBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="whaleFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.6" />
    </linearGradient>

    <!-- Crisp dark shadow for text contrast without frame -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020812" flood-opacity="0.95" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Water Surface Wave Pattern -->
    <linearGradient id="surfaceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes swimAcross {
      0% {
        transform: translate(-380px, 35px) scale(0.95);
      }
      50% {
        transform: translate(260px, 10px) scale(1);
      }
      100% {
        transform: translate(920px, 45px) scale(0.95);
      }
    }

    @keyframes swimUndulate {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-8px) rotate(-1.5deg);
      }
      75% {
        transform: translateY(8px) rotate(1.5deg);
      }
    }

    @keyframes tailFluke {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-7deg);
      }
    }

    @keyframes flipperMove {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(4deg);
      }
    }

    @keyframes raySway {
      0%, 100% {
        opacity: 0.12;
        transform: skewX(-4deg);
      }
      50% {
        opacity: 0.22;
        transform: skewX(4deg);
      }
    }

    @keyframes bubbleRise1 {
      0% {
        transform: translateY(290px) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-20px) translateX(25px);
        opacity: 0;
      }
    }

    @keyframes bubbleRise2 {
      0% {
        transform: translateY(290px) translateX(0);
        opacity: 0;
      }
      25% {
        opacity: 0.7;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-20px) translateX(-30px);
        opacity: 0;
      }
    }

    /* SHIMMERING & BIOLUMINESCENT GLOW ANIMATION FOR NGUYEN KHOA */
    @keyframes nameGlowShimmer {
      0%, 100% {
        fill: #ffffff;
        filter: drop-shadow(0 0 5px #38bdf8) drop-shadow(0 0 15px rgba(56, 189, 248, 0.75)) drop-shadow(0 3px 6px #010811);
      }
      33% {
        fill: #f0fdfa;
        filter: drop-shadow(0 0 12px #2dd4bf) drop-shadow(0 0 28px rgba(45, 212, 191, 0.95)) drop-shadow(0 3px 6px #010811);
      }
      66% {
        fill: #e0f2fe;
        filter: drop-shadow(0 0 8px #67e8f9) drop-shadow(0 0 20px rgba(103, 232, 249, 0.85)) drop-shadow(0 3px 6px #010811);
      }
    }

    /* TWINKLING SPARKLE STARS */
    @keyframes twinkleSparkle1 {
      0%, 100% { opacity: 0.15; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(45deg); filter: drop-shadow(0 0 6px #38bdf8); }
    }

    @keyframes twinkleSparkle2 {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(45deg); }
      50% { opacity: 1; transform: scale(1.4) rotate(90deg); filter: drop-shadow(0 0 8px #2dd4bf); }
    }

    .whale-swim-group {
      animation: swimAcross 22s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .whale-body-group {
      animation: swimUndulate 4s ease-in-out infinite;
    }

    .tail-group {
      transform-origin: 85px 85px;
      animation: tailFluke 3s ease-in-out infinite;
    }

    .flipper-group {
      transform-origin: 220px 95px;
      animation: flipperMove 4s ease-in-out infinite;
    }

    .ray1 {
      animation: raySway 7s ease-in-out infinite;
      transform-origin: 150px 0;
    }

    .ray2 {
      animation: raySway 9s ease-in-out infinite 1.5s;
      transform-origin: 450px 0;
    }

    .ray3 {
      animation: raySway 8s ease-in-out infinite 3s;
      transform-origin: 750px 0;
    }

    .b1 { animation: bubbleRise1 7s linear infinite; }
    .b2 { animation: bubbleRise2 9s linear infinite 1.8s; }
    .b3 { animation: bubbleRise1 6s linear infinite 3.2s; }
    .b4 { animation: bubbleRise2 8s linear infinite 4.5s; }
    .b5 { animation: bubbleRise1 10s linear infinite 0.8s; }
    .b6 { animation: bubbleRise2 7.5s linear infinite 2.3s; }
    .b7 { animation: bubbleRise1 8.5s linear infinite 5s; }

    .hud-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
      fill: #38bdf8;
    }

    /* SHIMMERING GLOWING NAME (NO BOX, CRISP & VIBRANT) */
    .title-name-glow {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 7px;
      animation: nameGlowShimmer 4s ease-in-out infinite;
    }

    /* CRISP SUBTITLE WITH CLEAN DARK OUTLINE CONTRAST */
    .title-sub {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13.5px;
      letter-spacing: 3.5px;
      fill: #2dd4bf;
      font-weight: 700;
      filter: drop-shadow(0 2px 4px #020812);
    }

    .sparkle-1 {
      animation: twinkleSparkle1 3s ease-in-out infinite;
      transform-origin: center;
    }

    .sparkle-2 {
      animation: twinkleSparkle2 3.5s ease-in-out infinite 1s;
      transform-origin: center;
    }
  </style>

  <!-- Deep Ocean Background -->
  <rect width="900" height="280" fill="url(#oceanBg)" rx="14" />

  <!-- Ocean Surface Shimmer Line -->
  <path d="M 0,0 C 150,5 300,1 450,4 C 600,1 750,5 900,2 L 900,0 L 0,0 Z" fill="url(#surfaceGlow)" />
  <line x1="0" y1="2" x2="900" y2="2" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Underwater Caustic Light Rays (God rays) -->
  <g class="ray1">
    <polygon points="120,0 200,0 320,280 180,280" fill="url(#sunRay)" />
  </g>
  <g class="ray2">
    <polygon points="420,0 520,0 660,280 500,280" fill="url(#sunRay2)" />
  </g>
  <g class="ray3">
    <polygon points="700,0 790,0 910,280 780,280" fill="url(#sunRay)" />
  </g>

  <!-- Rising Bioluminescent Bubbles -->
  <g opacity="0.65">
    <circle cx="120" cy="0" r="2.5" fill="#38bdf8" class="b1" filter="url(#softGlow)" />
    <circle cx="210" cy="0" r="3.5" fill="#2dd4bf" class="b2" filter="url(#softGlow)" />
    <circle cx="340" cy="0" r="2.0" fill="#7dd3fc" class="b3" />
    <circle cx="480" cy="0" r="4.0" fill="#38bdf8" class="b4" filter="url(#softGlow)" />
    <circle cx="620" cy="0" r="3.0" fill="#2dd4bf" class="b5" filter="url(#softGlow)" />
    <circle cx="750" cy="0" r="2.0" fill="#38bdf8" class="b6" />
    <circle cx="840" cy="0" r="3.5" fill="#7dd3fc" class="b7" filter="url(#softGlow)" />
  </g>

  <!-- Floating Deep Sea Plankton (subtle sparkles) -->
  <g opacity="0.4">
    <circle cx="80" cy="90" r="1" fill="#2dd4bf" />
    <circle cx="190" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="310" cy="70" r="1" fill="#7dd3fc" />
    <circle cx="560" cy="220" r="1.5" fill="#2dd4bf" />
    <circle cx="690" cy="110" r="1" fill="#38bdf8" />
    <circle cx="810" cy="160" r="1.2" fill="#7dd3fc" />
  </g>

  <!-- ANIMATED MAJESTIC BLUE WHALE (Swimming in Midground) -->
  <g class="whale-swim-group">
    <g class="whale-body-group">
      <!-- Ambient Whale Shadow/Glow -->
      <ellipse cx="220" cy="90" rx="140" ry="38" fill="#0284c7" opacity="0.2" filter="url(#softGlow)" />

      <!-- Whale Body Silhouette (Detailed Anatomical Curvature) -->
      <path d="
        M 85,85
        C 120,78 170,68 230,62
        C 285,57 330,62 365,72
        C 378,76 385,82 385,88
        C 385,96 372,106 350,113
        C 310,125 250,126 195,116
        C 150,108 110,95 85,85
        Z
      " fill="url(#whaleBody)" filter="url(#softGlow)" />

      <!-- Whale Lighter Belly (Ventral grooves area) -->
      <path d="
        M 195,116
        C 250,126 310,125 350,113
        C 365,108 375,101 378,96
        C 340,108 275,110 205,103
        C 165,99 125,92 100,86
        C 125,98 160,110 195,116
        Z
      " fill="url(#whaleBelly)" />

      <!-- Ventral Pleats / Grooves (Texture lines on throat) -->
      <g stroke="#38bdf8" stroke-width="0.7" opacity="0.45" fill="none">
        <path d="M 230,105 C 275,108 320,104 355,95" />
        <path d="M 245,110 C 285,112 325,107 350,101" />
        <path d="M 260,114 C 295,115 330,111 345,106" />
      </g>

      <!-- Whale Eye (Bioluminescent Aqua Glow) -->
      <circle cx="348" cy="82" r="2.2" fill="#2dd4bf" filter="url(#softGlow)" />
      <circle cx="348" cy="82" r="1.0" fill="#ffffff" />

      <!-- Whale Blowhole with gentle breath mist -->
      <ellipse cx="320" cy="62" rx="3" ry="1.2" fill="#0369a1" />
      <g opacity="0.5">
        <circle cx="318" cy="54" r="1.2" fill="#7dd3fc" />
        <circle cx="314" cy="46" r="1.8" fill="#38bdf8" />
        <circle cx="308" cy="37" r="2.2" fill="#2dd4bf" opacity="0.6" filter="url(#softGlow)" />
      </g>

      <!-- Whale Pectoral Fin (Flipper) -->
      <g class="flipper-group">
        <path d="
          M 255,98
          C 240,118 215,145 190,162
          C 183,166 177,166 178,160
          C 183,148 205,122 235,97
          Z
        " fill="url(#whaleFin)" stroke="#38bdf8" stroke-width="0.8" opacity="0.9" />
      </g>

      <!-- Whale Dorsal Fin -->
      <path d="
        M 130,73
        C 125,65 120,60 114,60
        C 116,66 117,72 120,76
        Z
      " fill="#0284c7" />

      <!-- Whale Tail Flukes -->
      <g class="tail-group">
        <path d="M 85,85 C 65,83 45,84 30,85 C 45,86 65,87 85,85 Z" fill="#0369a1" />
        <path d="
          M 30,85
          C 20,70 5,60 -10,58
          C -8,68 5,80 20,84
          C 5,88 -8,100 -10,110
          C 5,108 20,98 30,85
          Z
        " fill="url(#whaleBody)" stroke="#38bdf8" stroke-width="0.6" filter="url(#softGlow)" />
      </g>
    </g>
  </g>

  <!-- FOREGROUND: HUD & TYPOGRAPHY -->

  <!-- Top Ocean HUD Bar -->
  <g class="hud-text">
    <text x="35" y="32">DATE OF BIRTHDAY 18/06/2005</text>
    <text x="450.0" y="32" text-anchor="middle" letter-spacing="3.5px">NGUYEN QUOC KHOA</text>
    <text x="865" y="32" text-anchor="end" fill="#2dd4bf">VIET NAM</text>
  </g>
  <line x1="35" y1="40" x2="865" y2="40" stroke="#0284c7" stroke-width="0.8" opacity="0.5" />

  <!-- CENTER TYPOGRAPHY SECTION: NO BOX / NO FRAME — NATURALLY FLOATING WITH GLOWING SHIMMER -->
  <g transform="translate(450.0, 150)" text-anchor="middle">
    <!-- Twinkling Sparkle 1 (Top Left of Name) -->
    <g transform="translate(-195, -16)">
      <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="#2dd4bf" class="sparkle-1" />
    </g>

    <!-- Twinkling Sparkle 2 (Top Right of Name) -->
    <g transform="translate(195, -20)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#38bdf8" class="sparkle-2" />
    </g>

    <!-- Twinkling Sparkle 3 (Bottom Right) -->
    <g transform="translate(160, 22)">
      <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="#7dd3fc" class="sparkle-1" style="animation-delay: 1.5s;" />
    </g>

    <!-- Main Name: NGUYEN KHOA (No Box! Shimmering, pulsing bioluminescent glow) -->
    <text y="0" class="title-name-glow">NGUYEN KHOA</text>

    <!-- Subtitle: FULL-STACK DEVELOPER • DEEP OCEAN ARCHITECT (Bright seafoam cyan, crisp drop shadow) -->
    <text y="28" class="title-sub">FULL-STACK DEVELOPER  •  DEEP OCEAN ARCHITECT</text>
  </g>

  <!-- Bottom Oceanic Telemetry Line -->
  <g transform="translate(450.0, 236)" text-anchor="middle">
    <rect x="-250" y="-14" width="500" height="26" rx="13" fill="#041629" stroke="#0284c7" stroke-width="1" opacity="0.9" />
    <circle cx="-225" cy="-1" r="4" fill="#2dd4bf" class="b1" style="animation-duration: 2s;" />
    <text x="5" y="3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7dd3fc" letter-spacing="2.5px">
      DIVING DEEP INTO COMPLEX SYSTEMS &amp; CLEAN CODE
    </text>
  </g>

  <!-- Corner Framers (Tech Oceanic Bracket Details) -->
  <g stroke="#0284c7" stroke-width="1.8" fill="none" opacity="0.8">
    <polyline points="15,25 15,15 25,15" />
    <polyline points="885,25 885,15 875,15" />
    <polyline points="15,255 15,265 25,265" />
    <polyline points="885,255 885,265 875,265" />
  </g>
</svg>
