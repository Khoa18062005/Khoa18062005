<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="15" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="scanGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#06b6d440"/>
      <stop offset="50%" stop-color="#06b6d4aa"/>
      <stop offset="70%" stop-color="#06b6d440"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes fall0 { 0% { transform: translateY(-30px); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(260px); opacity: 0; } }
    @keyframes fall1 { 0% { transform: translateY(-50px); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(280px); opacity: 0; } }
    @keyframes fall2 { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(250px); opacity: 0; } }
    @keyframes scanMove { 0% { transform: translateY(-10px); } 100% { transform: translateY(240px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes circuitPulse { 0% { stroke-dashoffset: 200; opacity: 0.2; } 50% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0.2; } }
    @keyframes subtitleFade { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes textGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

    .matrix-char { font-family: 'Courier New', monospace; fill: #14b8a6; }
    .matrix-fast { animation: fall0 2.5s linear infinite; }
    .matrix-med { animation: fall1 4s linear infinite; }
    .matrix-slow { animation: fall2 6s linear infinite; }
    .scan-bar { animation: scanMove 3s ease-in-out infinite; }
    .circuit-line { stroke-dasharray: 200; animation: circuitPulse 3s ease-in-out infinite; }
    .circuit-line2 { stroke-dasharray: 200; animation: circuitPulse 3s ease-in-out infinite; animation-delay: 1.5s; }
    .title-text { animation: textGlow 4s ease-in-out infinite; }
    .subtitle { animation: subtitleFade 5s ease-in-out infinite; }
    .cursor { animation: cursorBlink 1s step-end infinite; }
    .dot-pulse { animation: pulse 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="850" height="230" fill="#0a0e17"/>

  <!-- Faint grid -->
  <g opacity="0.05" stroke="#06b6d4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="230"/><line x1="50" y1="0" x2="50" y2="230"/>
    <line x1="100" y1="0" x2="100" y2="230"/><line x1="150" y1="0" x2="150" y2="230"/>
    <line x1="200" y1="0" x2="200" y2="230"/><line x1="250" y1="0" x2="250" y2="230"/>
    <line x1="300" y1="0" x2="300" y2="230"/><line x1="350" y1="0" x2="350" y2="230"/>
    <line x1="400" y1="0" x2="400" y2="230"/><line x1="450" y1="0" x2="450" y2="230"/>
    <line x1="500" y1="0" x2="500" y2="230"/><line x1="550" y1="0" x2="550" y2="230"/>
    <line x1="600" y1="0" x2="600" y2="230"/><line x1="650" y1="0" x2="650" y2="230"/>
    <line x1="700" y1="0" x2="700" y2="230"/><line x1="750" y1="0" x2="750" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="230"/><line x1="850" y1="0" x2="850" y2="230"/>
    <line x1="0" y1="0" x2="850" y2="0"/><line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/><line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
  </g>

  <!-- Matrix rain columns -->
  <g class="matrix-char" font-size="12" opacity="0.6">
    <!-- Column 1 -->
    <text x="30" y="0" class="matrix-fast" style="animation-delay:0s">0</text>
    <text x="30" y="20" class="matrix-fast" style="animation-delay:0.1s">1</text>
    <text x="30" y="40" class="matrix-fast" style="animation-delay:0.2s">A</text>
    <text x="30" y="60" class="matrix-fast" style="animation-delay:0.3s">F</text>
    <!-- Column 2 -->
    <text x="65" y="0" class="matrix-med" style="animation-delay:0.5s">1</text>
    <text x="65" y="20" class="matrix-med" style="animation-delay:0.6s">0</text>
    <text x="65" y="40" class="matrix-med" style="animation-delay:0.7s">C</text>
    <text x="65" y="60" class="matrix-med" style="animation-delay:0.8s">0</text>
    <!-- Column 3 -->
    <text x="95" y="0" class="matrix-slow" style="animation-delay:1.2s">D</text>
    <text x="95" y="20" class="matrix-slow" style="animation-delay:1.3s">1</text>
    <text x="95" y="40" class="matrix-slow" style="animation-delay:1.4s">0</text>
    <!-- Column 4 -->
    <text x="130" y="0" class="matrix-fast" style="animation-delay:0.8s">0</text>
    <text x="130" y="20" class="matrix-fast" style="animation-delay:0.9s">E</text>
    <text x="130" y="40" class="matrix-fast" style="animation-delay:1.0s">1</text>
    <text x="130" y="60" class="matrix-fast" style="animation-delay:1.1s">B</text>
    <!-- Column 5 -->
    <text x="160" y="0" class="matrix-med" style="animation-delay:1.5s">1</text>
    <text x="160" y="20" class="matrix-med" style="animation-delay:1.6s">0</text>
    <text x="160" y="40" class="matrix-med" style="animation-delay:1.7s">1</text>
    <!-- Column 6 -->
    <text x="190" y="0" class="matrix-slow" style="animation-delay:0.3s">F</text>
    <text x="190" y="20" class="matrix-slow" style="animation-delay:0.4s">0</text>
    <text x="190" y="40" class="matrix-slow" style="animation-delay:0.5s">A</text>
    <text x="190" y="60" class="matrix-slow" style="animation-delay:0.6s">1</text>
    <!-- Column 7 - right side -->
    <text x="660" y="0" class="matrix-fast" style="animation-delay:0.2s">1</text>
    <text x="660" y="20" class="matrix-fast" style="animation-delay:0.3s">0</text>
    <text x="660" y="40" class="matrix-fast" style="animation-delay:0.4s">B</text>
    <text x="660" y="60" class="matrix-fast" style="animation-delay:0.5s">1</text>
    <!-- Column 8 -->
    <text x="695" y="0" class="matrix-med" style="animation-delay:0.7s">0</text>
    <text x="695" y="20" class="matrix-med" style="animation-delay:0.8s">C</text>
    <text x="695" y="40" class="matrix-med" style="animation-delay:0.9s">1</text>
    <!-- Column 9 -->
    <text x="725" y="0" class="matrix-slow" style="animation-delay:1.0s">E</text>
    <text x="725" y="20" class="matrix-slow" style="animation-delay:1.1s">1</text>
    <text x="725" y="40" class="matrix-slow" style="animation-delay:1.2s">0</text>
    <text x="725" y="60" class="matrix-slow" style="animation-delay:1.3s">D</text>
    <!-- Column 10 -->
    <text x="755" y="0" class="matrix-fast" style="animation-delay:1.4s">0</text>
    <text x="755" y="20" class="matrix-fast" style="animation-delay:1.5s">1</text>
    <text x="755" y="40" class="matrix-fast" style="animation-delay:1.6s">A</text>
    <!-- Column 11 -->
    <text x="785" y="0" class="matrix-med" style="animation-delay:0.1s">1</text>
    <text x="785" y="20" class="matrix-med" style="animation-delay:0.2s">F</text>
    <text x="785" y="40" class="matrix-med" style="animation-delay:0.3s">0</text>
    <text x="785" y="60" class="matrix-med" style="animation-delay:0.4s">1</text>
    <!-- Column 12 -->
    <text x="815" y="0" class="matrix-slow" style="animation-delay:0.9s">B</text>
    <text x="815" y="20" class="matrix-slow" style="animation-delay:1.0s">0</text>
    <text x="815" y="40" class="matrix-slow" style="animation-delay:1.1s">1</text>
  </g>

  <!-- Circuit board lines - LEFT -->
  <g fill="none" stroke-width="1.5">
    <path d="M 0,50 H 40 L 60,70 H 100 L 110,60 H 140" stroke="url(#circuitGrad)" class="circuit-line" opacity="0.6"/>
    <path d="M 0,90 H 50 L 65,105 H 120" stroke="url(#circuitGrad)" class="circuit-line2" opacity="0.6"/>
    <path d="M 0,140 H 30 L 50,120 H 80 L 95,135 H 130" stroke="url(#circuitGrad)" class="circuit-line" opacity="0.4" style="animation-delay:0.7s"/>
    <path d="M 0,180 H 60 L 75,165 H 110" stroke="url(#circuitGrad)" class="circuit-line2" opacity="0.4" style="animation-delay:2s"/>
    <!-- Circuit dots -->
    <circle cx="140" cy="60" r="3" fill="#14b8a6" class="dot-pulse" opacity="0.8"/>
    <circle cx="120" cy="105" r="3" fill="#0ea5e9" class="dot-pulse" opacity="0.8" style="animation-delay:1s"/>
    <circle cx="130" cy="135" r="2.5" fill="#06b6d4" class="dot-pulse" opacity="0.6" style="animation-delay:0.5s"/>
    <circle cx="110" cy="165" r="2.5" fill="#14b8a6" class="dot-pulse" opacity="0.6" style="animation-delay:1.5s"/>
  </g>

  <!-- Circuit board lines - RIGHT -->
  <g fill="none" stroke-width="1.5">
    <path d="M 850,50 H 810 L 790,70 H 750 L 740,60 H 710" stroke="url(#circuitGrad)" class="circuit-line" opacity="0.6" style="animation-delay:0.5s"/>
    <path d="M 850,90 H 800 L 785,105 H 730" stroke="url(#circuitGrad)" class="circuit-line2" opacity="0.6" style="animation-delay:0.3s"/>
    <path d="M 850,140 H 820 L 800,120 H 770 L 755,135 H 720" stroke="url(#circuitGrad)" class="circuit-line" opacity="0.4" style="animation-delay:1.2s"/>
    <path d="M 850,180 H 790 L 775,165 H 740" stroke="url(#circuitGrad)" class="circuit-line2" opacity="0.4" style="animation-delay:2.3s"/>
    <!-- Circuit dots -->
    <circle cx="710" cy="60" r="3" fill="#14b8a6" class="dot-pulse" opacity="0.8" style="animation-delay:0.5s"/>
    <circle cx="730" cy="105" r="3" fill="#0ea5e9" class="dot-pulse" opacity="0.8" style="animation-delay:1.5s"/>
    <circle cx="720" cy="135" r="2.5" fill="#06b6d4" class="dot-pulse" opacity="0.6" style="animation-delay:1s"/>
    <circle cx="740" cy="165" r="2.5" fill="#14b8a6" class="dot-pulse" opacity="0.6" style="animation-delay:2s"/>
  </g>

  <!-- Scanning line -->
  <rect class="scan-bar" x="0" y="-10" width="850" height="3" fill="url(#scanLine)" opacity="0.6">
  </rect>
  <rect class="scan-bar" x="0" y="-10" width="850" height="20" fill="url(#scanLine)" opacity="0.1">
  </rect>

  <!-- Central glowing title -->
  <g class="title-text" filter="url(#neonGlow)">
    <text x="425" y="100" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="48" font-weight="bold" fill="url(#titleGrad)" letter-spacing="8">KHOA NGUYEN</text>
  </g>

  <!-- Subtitle -->
  <text class="subtitle" x="425" y="140" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="14" fill="#06b6d4" letter-spacing="3" opacity="0.8">Full-Stack Developer • Digital Craftsman</text>

  <!-- Decorative brackets around subtitle -->
  <text x="180" y="142" font-family="'Courier New', monospace" font-size="16" fill="#0ea5e9" opacity="0.5" class="dot-pulse">&lt;</text>
  <text x="660" y="142" font-family="'Courier New', monospace" font-size="16" fill="#0ea5e9" opacity="0.5" class="dot-pulse" style="animation-delay:1s">/&gt;</text>

  <!-- Bottom decorative line -->
  <line x1="250" y1="165" x2="600" y2="165" stroke="url(#titleGrad)" stroke-width="1" opacity="0.3"/>
  <circle cx="250" cy="165" r="2" fill="#0ea5e9" class="dot-pulse" opacity="0.6"/>
  <circle cx="600" cy="165" r="2" fill="#14b8a6" class="dot-pulse" opacity="0.6" style="animation-delay:1s"/>

  <!-- Bottom status line -->
  <text x="425" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#0d9488" opacity="0.5">
    <tspan>[ system.status: ONLINE ]</tspan>
    <tspan class="cursor" fill="#14b8a6"> █</tspan>
  </text>

  <!-- Corner accents -->
  <polyline points="5,20 5,5 20,5" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
  <polyline points="830,5 845,5 845,20" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
  <polyline points="5,210 5,225 20,225" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
  <polyline points="830,225 845,225 845,210" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="848" height="228" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15" rx="2"/>
</svg>
