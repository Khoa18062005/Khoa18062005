<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="400" viewBox="0 0 850 400" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Scope Clip (Shifted left to cx=200) -->
    <clipPath id="radarClip">
      <circle cx="200" cy="200" r="160"/>
    </clipPath>

    <!-- Radar Sweep Glow Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Radar Background Radial -->
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#210d3a"/>
      <stop offset="100%" stop-color="#0c0517"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseSoft { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.75; transform: scale(1.15); } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.5; } }
    
    /* Center Star Glowing Pulse */
    @keyframes starGlowPulse {
      0%, 100% {
        filter: drop-shadow(0 0 4px #fde047);
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 10px #fde047) drop-shadow(0 0 18px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 5px #ffffff);
        transform: scale(1.18);
      }
    }

    /* Twinkling and Drifting Cosmic Particles (Matching Hinh 2) */
    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-30px) translateX(15px); opacity: 0; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-35px) translateX(-12px); opacity: 0; }
    }

    .sweep-arm { transform-origin: 200px 200px; animation: sweep 6s linear infinite; }
    .ring { animation: ringPulse 4s ease-in-out infinite; }
    .star-center { transform-origin: 200px 200px; animation: starGlowPulse 2.8s ease-in-out infinite; }
    
    /* Blip pulses */
    .blip-pulse { transform-box: fill-box; transform-origin: center; animation: pulseSoft 3s ease-in-out infinite; }
    .blip-pulse2 { transform-box: fill-box; transform-origin: center; animation: pulseSoft 3.8s ease-in-out infinite 0.6s; }
    .blip-pulse3 { transform-box: fill-box; transform-origin: center; animation: pulseSoft 4.4s ease-in-out infinite 1.2s; }
    .blip-pulse4 { transform-box: fill-box; transform-origin: center; animation: pulseSoft 3.5s ease-in-out infinite 1.8s; }

    /* Particles */
    .twinkle-1 { animation: sparkleTwinkle 2.5s ease-in-out infinite; }
    .twinkle-2 { animation: sparkleTwinkle 3.5s ease-in-out infinite 1s; }
    .twinkle-3 { animation: sparkleTwinkle 2.0s ease-in-out infinite 0.5s; }
    .float-star1 { animation: floatParticle1 6s linear infinite; }
    .float-star2 { animation: floatParticle2 8s linear infinite 2.5s; }

    .label { font-family: 'Courier New', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.2px; }
    .mono { font-family: 'Courier New', monospace; font-weight: 600; }
    .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
  </style>

  <!-- Background Canvas (Width 850, identical to crystal-matrix.svg) -->
  <rect width="850" height="400" rx="14" fill="#0d061a" stroke="#2d134d" stroke-width="1.5"/>

  <!-- Background Coordinate Grid -->
  <g opacity="0.05" stroke="#f472b6" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="0" y1="40" x2="850" y2="40"/><line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/><line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="0" y1="280" x2="850" y2="280"/><line x1="0" y1="320" x2="850" y2="320"/>
    <line x1="0" y1="360" x2="850" y2="360"/>
  </g>

  <!-- Animated White Starlight Field (Twinkling Cosmic Particles - Matching Hình 2) -->
  <g fill="#ffffff">
    <circle cx="50" cy="30" r="1.5" class="twinkle-1" opacity="0.8"/>
    <circle cx="110" cy="65" r="1.2" class="twinkle-2" opacity="0.6"/>
    <circle cx="170" cy="25" r="1.8" class="twinkle-3" opacity="0.9"/>
    <circle cx="280" cy="40" r="1" class="twinkle-1" opacity="0.7"/>
    <circle cx="370" cy="25" r="1.5" class="twinkle-2" opacity="0.8"/>
    <circle cx="430" cy="70" r="1.2" class="twinkle-3" opacity="0.6"/>
    <circle cx="490" cy="25" r="1.6" class="twinkle-1" opacity="0.85"/>
    <circle cx="580" cy="55" r="1.2" class="twinkle-2" opacity="0.65"/>
    <circle cx="680" cy="25" r="1.8" class="twinkle-3" opacity="0.9"/>
    <circle cx="770" cy="60" r="1.3" class="twinkle-1" opacity="0.75"/>
    <circle cx="825" cy="25" r="1.5" class="twinkle-2" opacity="0.8"/>

    <circle cx="40" cy="360" r="1.5" class="twinkle-2" opacity="0.7"/>
    <circle cx="130" cy="375" r="1.2" class="twinkle-3" opacity="0.6"/>
    <circle cx="260" cy="365" r="1.6" class="twinkle-1" opacity="0.85"/>
    <circle cx="380" cy="375" r="1.2" class="twinkle-2" opacity="0.65"/>
    <circle cx="470" cy="360" r="1.8" class="twinkle-3" opacity="0.9"/>
    <circle cx="600" cy="375" r="1.2" class="twinkle-1" opacity="0.7"/>
    <circle cx="720" cy="365" r="1.5" class="twinkle-2" opacity="0.8"/>
    <circle cx="810" cy="370" r="1.3" class="twinkle-3" opacity="0.75"/>
  </g>

  <!-- Floating Stardust Particles (Moving gently across space) -->
  <g fill="#ffffff">
    <circle cx="85" cy="180" r="1.4" class="float-star1" opacity="0.75"/>
    <circle cx="290" cy="110" r="1.5" class="float-star2" opacity="0.85"/>
    <circle cx="340" cy="260" r="1.2" class="float-star1" opacity="0.7"/>
    <circle cx="440" cy="190" r="1.6" class="float-star2" opacity="0.9"/>
    <circle cx="620" cy="140" r="1.3" class="float-star1" opacity="0.8"/>
    <circle cx="750" cy="220" r="1.5" class="float-star2" opacity="0.85"/>
  </g>

  <!-- ════════════════ RADAR SCOPE (Shifted Left to cx=200) ════════════════ -->
  <!-- Scope Body -->
  <circle cx="200" cy="200" r="160" fill="url(#radarBg)" stroke="#db2777" stroke-width="1.8"/>

  <!-- Concentric Rings Aligned with 4 Tech Tiers -->
  <!-- Tier IV: DevOps (Outer, r=160) -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1.2" class="ring" stroke-dasharray="4 3"/>
  <!-- Tier III: Database (Mid-Outer, r=125) -->
  <circle cx="200" cy="200" r="125" fill="none" stroke="#c084fc" stroke-width="1" class="ring" stroke-dasharray="3 3"/>
  <!-- Tier II: Backend (Mid-Inner, r=95) -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#fde047" stroke-width="1.1" class="ring"/>
  <!-- Tier I: Frontend (Inner, r=55) -->
  <circle cx="200" cy="200" r="55" fill="none" stroke="#f472b6" stroke-width="1.2" class="ring" stroke-dasharray="2 3"/>
  
  <!-- Center Steven Core Disc -->
  <circle cx="200" cy="200" r="18" fill="#be185d" fill-opacity="0.35" stroke="#fde047" stroke-width="1"/>

  <!-- Radar Crosshairs (Warp Axes) -->
  <g stroke="#9d174d" stroke-width="0.8" opacity="0.35">
    <line x1="40" y1="200" x2="360" y2="200"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="87" y1="87" x2="313" y2="313" stroke-dasharray="2 4"/>
    <line x1="87" y1="313" x2="313" y2="87" stroke-dasharray="2 4"/>
  </g>

  <!-- Rotating Sweep Arm -->
  <g clip-path="url(#radarClip)">
    <g class="sweep-arm">
      <polygon points="200,200 360,130 360,200" fill="url(#sweepGrad)"/>
      <line x1="200" y1="200" x2="360" y2="200" stroke="#fde047" stroke-width="2"/>
    </g>
  </g>

  <!-- Glowing Star of Steven at Center (Radiant Pulsating Glow) -->
  <g class="star-center">
    <polygon points="200,190 203.5,196.5 211,196.5 205.5,201 207.5,208.5 200,204.5 192.5,208.5 194.5,201 189,196.5 196.5,196.5"
             fill="#fde047" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round"/>
  </g>

  <!-- ═══════════════ BLIPS (TIER TECH STACK - REFINED SIZES & SPREAD) ═══════════════ -->

  <!-- TIER I: FRONTEND & UXUI (Pink Blips #f472b6) -->
  <!-- 1. React.js -->
  <g>
    <circle cx="161" cy="161" r="4.8" fill="#f472b6" opacity="0.25" class="blip-pulse"/>
    <circle cx="161" cy="161" r="2.6" fill="#f472b6"/>
    <text x="153" y="164" class="label" fill="#fbcfe8" text-anchor="end">React.js</text>
  </g>

  <!-- 2. TypeScript -->
  <g>
    <circle cx="161" cy="239" r="4.8" fill="#f472b6" opacity="0.25" class="blip-pulse2"/>
    <circle cx="161" cy="239" r="2.6" fill="#f472b6"/>
    <text x="153" y="242" class="label" fill="#fbcfe8" text-anchor="end">TypeScript</text>
  </g>

  <!-- 3. Tailwind CSS -->
  <g>
    <circle cx="239" cy="239" r="4.8" fill="#f472b6" opacity="0.25" class="blip-pulse3"/>
    <circle cx="239" cy="239" r="2.6" fill="#f472b6"/>
    <text x="247" y="242" class="label" fill="#fbcfe8" text-anchor="start">Tailwind CSS</text>
  </g>

  <!-- 4. Astro -->
  <g>
    <circle cx="239" cy="161" r="4.8" fill="#f472b6" opacity="0.25" class="blip-pulse4"/>
    <circle cx="239" cy="161" r="2.6" fill="#f472b6"/>
    <text x="247" y="164" class="label" fill="#fbcfe8" text-anchor="start">Astro</text>
  </g>

  <!-- TIER II: BACKEND (Gold Blips #fde047) -->
  <!-- 5. Spring Boot -->
  <g>
    <circle cx="105" cy="192" r="4.8" fill="#fde047" opacity="0.25" class="blip-pulse"/>
    <circle cx="105" cy="192" r="2.6" fill="#fde047"/>
    <text x="97" y="195" class="label" fill="#fef08a" text-anchor="end">Spring Boot</text>
  </g>

  <!-- 6. Golang -->
  <g>
    <circle cx="225" cy="108" r="4.8" fill="#fde047" opacity="0.25" class="blip-pulse2"/>
    <circle cx="225" cy="108" r="2.6" fill="#fde047"/>
    <text x="233" y="111" class="label" fill="#fef08a" text-anchor="start">Golang</text>
  </g>

  <!-- 7. Node.js -->
  <g>
    <circle cx="225" cy="292" r="4.8" fill="#fde047" opacity="0.25" class="blip-pulse3"/>
    <circle cx="225" cy="292" r="2.6" fill="#fde047"/>
    <text x="233" y="295" class="label" fill="#fef08a" text-anchor="start">Node.js</text>
  </g>

  <!-- 8. Python -->
  <g>
    <circle cx="282" cy="153" r="4.8" fill="#fde047" opacity="0.25" class="blip-pulse4"/>
    <circle cx="282" cy="153" r="2.6" fill="#fde047"/>
    <text x="290" y="156" class="label" fill="#fef08a" text-anchor="start">Python</text>
  </g>

  <!-- TIER III: DATABASE (Purple Blips #c084fc) -->
  <!-- 9. PostgreSQL -->
  <g>
    <circle cx="320" cy="168" r="4.8" fill="#c084fc" opacity="0.25" class="blip-pulse"/>
    <circle cx="320" cy="168" r="2.6" fill="#c084fc"/>
    <text x="328" y="171" class="label" fill="#e9d5ff" text-anchor="start">PostgreSQL</text>
  </g>

  <!-- 10. MySQL -->
  <g>
    <circle cx="87" cy="253" r="4.8" fill="#c084fc" opacity="0.25" class="blip-pulse2"/>
    <circle cx="87" cy="253" r="2.6" fill="#c084fc"/>
    <text x="79" y="256" class="label" fill="#e9d5ff" text-anchor="end">MySQL</text>
  </g>

  <!-- 11. MongoDB -->
  <g>
    <circle cx="147" cy="87" r="4.8" fill="#c084fc" opacity="0.25" class="blip-pulse3"/>
    <circle cx="147" cy="87" r="2.6" fill="#c084fc"/>
    <text x="139" y="90" class="label" fill="#e9d5ff" text-anchor="end">MongoDB</text>
  </g>

  <!-- TIER IV: DEVOPS & INFRASTRUCTURE (Cyan Blips #38bdf8) -->
  <!-- 12. Docker -->
  <g>
    <circle cx="77" cy="114" r="4.8" fill="#38bdf8" opacity="0.25" class="blip-pulse"/>
    <circle cx="77" cy="114" r="2.6" fill="#38bdf8"/>
    <text x="69" y="117" class="label" fill="#bae6fd" text-anchor="end">Docker</text>
  </g>

  <!-- 13. AWS Console -->
  <g>
    <circle cx="315" cy="296" r="4.8" fill="#38bdf8" opacity="0.25" class="blip-pulse2"/>
    <circle cx="315" cy="296" r="2.6" fill="#38bdf8"/>
    <text x="323" y="299" class="label" fill="#bae6fd" text-anchor="start">AWS Console</text>
  </g>

  <!-- 14. GitLab CI/CD -->
  <g>
    <circle cx="104" cy="315" r="4.8" fill="#38bdf8" opacity="0.25" class="blip-pulse3"/>
    <circle cx="104" cy="315" r="2.6" fill="#38bdf8"/>
    <text x="96" y="318" class="label" fill="#bae6fd" text-anchor="end">GitLab CI/CD</text>
  </g>

  <!-- 15. GitLab Runner -->
  <g>
    <circle cx="315" cy="104" r="4.8" fill="#38bdf8" opacity="0.25" class="blip-pulse4"/>
    <circle cx="315" cy="104" r="2.6" fill="#38bdf8"/>
    <text x="323" y="107" class="label" fill="#bae6fd" text-anchor="start">GitLab Runner</text>
  </g>

  <!-- ═══════════════ RIGHT PANEL: TECH STACK TIERS CONSTELLATION ═══════════════ -->
  <g transform="translate(445, 42)">
    <!-- Header Box (Matching Hình 1) -->
    <rect x="0" y="0" width="370" height="34" rx="6" fill="#1e0c36" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="185" y="22" class="sans" font-size="12" font-weight="800" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">
      ★ TECH STACK TIERS CONSTELLATION ★
    </text>

    <!-- Tier I: Frontend -->
    <g transform="translate(0, 60)">
      <!-- Glowing dot centered between the two rows -->
      <circle cx="12" cy="18" r="8.5" fill="#f472b6" opacity="0.25"/>
      <circle cx="12" cy="18" r="4.5" fill="#f472b6"/>
      <text x="28" y="12" class="mono" font-size="11.5" font-weight="700" fill="#fbcfe8">TIER I: FRONTEND &amp; UXUI</text>
      <text x="28" y="30" class="mono" font-size="10" fill="#e9d5ff">React • Astro • TypeScript • Tailwind • JS</text>
    </g>

    <!-- Tier II: Backend -->
    <g transform="translate(0, 132)">
      <!-- Glowing dot centered between the two rows -->
      <circle cx="12" cy="18" r="8.5" fill="#fde047" opacity="0.25"/>
      <circle cx="12" cy="18" r="4.5" fill="#fde047"/>
      <text x="28" y="12" class="mono" font-size="11.5" font-weight="700" fill="#fef08a">TIER II: BACKEND</text>
      <text x="28" y="30" class="mono" font-size="10" fill="#e9d5ff">Golang • Spring Boot • Servlet • Node • Python</text>
    </g>

    <!-- Tier III: Database -->
    <g transform="translate(0, 204)">
      <!-- Glowing dot centered between the two rows -->
      <circle cx="12" cy="18" r="8.5" fill="#c084fc" opacity="0.25"/>
      <circle cx="12" cy="18" r="4.5" fill="#c084fc"/>
      <text x="28" y="12" class="mono" font-size="11.5" font-weight="700" fill="#e9d5ff">TIER III: DATABASE</text>
      <text x="28" y="30" class="mono" font-size="10" fill="#e9d5ff">PostgreSQL • MySQL • MongoDB</text>
    </g>

    <!-- Tier IV: DevOps & Infrastructure -->
    <g transform="translate(0, 276)">
      <!-- Glowing dot centered between the two rows -->
      <circle cx="12" cy="18" r="8.5" fill="#38bdf8" opacity="0.25"/>
      <circle cx="12" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="28" y="12" class="mono" font-size="11.5" font-weight="700" fill="#bae6fd">TIER IV: DEVOPS &amp; INFRASTRUCTURE</text>
      <text x="28" y="30" class="mono" font-size="10" fill="#e9d5ff">GitLab CI/CD • Runner • AWS • Docker</text>
    </g>
  </g>
</svg>