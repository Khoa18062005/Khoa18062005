<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="400" viewBox="0 0 850 400" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <filter id="gemGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="radarClip">
      <circle cx="315" cy="200" r="160"/>
    </clipPath>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#210d3a"/>
      <stop offset="100%" stop-color="#0c0517"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes blipPulse { 0%, 70%, 100% { opacity: 0.5; r: 4; } 80% { opacity: 1; r: 7.5; } }
    @keyframes blipPulse2 { 0%, 50%, 100% { opacity: 0.4; r: 4; } 60% { opacity: 1; r: 7.5; } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.4; } }

    .sweep-arm { transform-origin: 315px 200px; animation: sweep 6s linear infinite; }
    .ring { animation: ringPulse 4s ease-in-out infinite; }
    .blip-core { animation: blipPulse 6s linear infinite; }
    .blip-prof { animation: blipPulse2 6s linear infinite; }
    .label { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #fbcfe8; font-weight: 600; }
    .ring-label { font-family: 'Courier New', monospace; font-size: 10px; fill: #d8b4fe; letter-spacing: 1px; font-weight: 700; }
    .mono { font-family: 'Courier New', monospace; font-weight: 600; }
  </style>

  <!-- Background Canvas (Width 850, identical to crystal-matrix.svg) -->
  <rect width="850" height="400" rx="14" fill="#0d061a" stroke="#2d134d" stroke-width="1.5"/>

  <!-- Background Coordinate Grid -->
  <g opacity="0.05" stroke="#f472b6" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="0" y1="40" x2="850" y2="40"/><line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/><line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="0" y1="280" x2="850" y2="280"/><line x1="0" y1="320" x2="850" y2="320"/>
    <line x1="0" y1="360" x2="850" y2="360"/>
  </g>

  <!-- Radar Scope Body -->
  <circle cx="315" cy="200" r="160" fill="url(#radarBg)" stroke="#db2777" stroke-width="1.8" filter="url(#gemGlow)"/>

  <!-- Radar Concentric Rings -->
  <circle cx="315" cy="200" r="160" fill="none" stroke="#f43f5e" stroke-width="1.2" class="ring" stroke-dasharray="4 3"/>
  <circle cx="315" cy="200" r="115" fill="none" stroke="#eab308" stroke-width="1" class="ring" stroke-dasharray="3 3"/>
  <circle cx="315" cy="200" r="65" fill="none" stroke="#ec4899" stroke-width="1.2" class="ring"/>
  <circle cx="315" cy="200" r="22" fill="#be185d" fill-opacity="0.3" stroke="#fde047" stroke-width="1"/>

  <!-- Radar Crosshairs (Warp Axes) -->
  <g stroke="#9d174d" stroke-width="0.8" opacity="0.4">
    <line x1="155" y1="200" x2="475" y2="200"/>
    <line x1="315" y1="40" x2="315" y2="360"/>
    <line x1="202" y1="87" x2="428" y2="313" stroke-dasharray="2 4"/>
    <line x1="202" y1="313" x2="428" y2="87" stroke-dasharray="2 4"/>
  </g>

  <!-- Rotating Sweep Arm -->
  <g clip-path="url(#radarClip)">
    <g class="sweep-arm">
      <polygon points="315,200 475,130 475,200" fill="url(#sweepGrad)"/>
      <line x1="315" y1="200" x2="475" y2="200" stroke="#fde047" stroke-width="2" filter="url(#gemGlow)"/>
    </g>
  </g>

  <!-- Central Star of Steven -->
  <polygon points="315,191 318,197 325,197 320,201 322,208 315,204 308,208 310,201 305,197 312,197" fill="#fde047" stroke="#ffffff" stroke-width="0.8"/>

  <!-- Ring Labels -->
  <text x="319" y="195" class="ring-label" fill="#f43f5e" font-size="8">CORE</text>
  <text x="319" y="132" class="ring-label" fill="#eab308" font-size="8">FUSED</text>
  <text x="319" y="82" class="ring-label" fill="#c084fc" font-size="8">WARP</text>

  <!-- Skill Blips -->
  <!-- Inner Ring: Core Masteries -->
  <circle cx="295" cy="180" r="4.5" fill="#fde047" class="blip-core" filter="url(#dotGlow)"/>
  <text x="225" y="178" class="label" fill="#fde047">Spring Boot</text>

  <circle cx="340" cy="182" r="4.5" fill="#f43f5e" class="blip-core" filter="url(#dotGlow)"/>
  <text x="349" y="184" class="label" fill="#f43f5e">Redis Redlock</text>

  <circle cx="323" cy="225" r="4" fill="#fde047" class="blip-core" filter="url(#dotGlow)"/>
  <text x="331" y="233" class="label" fill="#fde047">Java (OOP)</text>

  <!-- Middle Ring: Fused Proficiencies -->
  <circle cx="370" cy="150" r="4.5" fill="#ec4899" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="379" y="152" class="label" fill="#fbcfe8">PostgreSQL</text>

  <circle cx="245" cy="220" r="4.5" fill="#a855f7" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="175" y="222" class="label" fill="#e9d5ff">TypeScript</text>

  <circle cx="280" cy="130" r="4.5" fill="#38bdf8" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="230" y="126" class="label" fill="#bae6fd">React 19</text>

  <circle cx="375" cy="245" r="4" fill="#a855f7" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="383" y="252" class="label" fill="#e9d5ff">Tailwind CSS</text>

  <!-- Outer Ring: Warp Explorations & DevOps -->
  <circle cx="230" cy="105" r="4" fill="#38bdf8" class="blip-core" filter="url(#dotGlow)"/>
  <text x="175" y="102" class="label" fill="#bae6fd">Docker</text>

  <circle cx="410" cy="115" r="4" fill="#fde047" class="blip-core" filter="url(#dotGlow)"/>
  <text x="418" y="117" class="label" fill="#fef08a">PyTorch / AI</text>

  <circle cx="410" cy="290" r="4" fill="#ec4899" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="419" y="295" class="label" fill="#fbcfe8">AWS &amp; Nginx</text>

  <circle cx="215" cy="285" r="4" fill="#a855f7" class="blip-prof" filter="url(#dotGlow)"/>
  <text x="160" y="292" class="label" fill="#e9d5ff">Alpha-Beta</text>

  <!-- Right Panel: Radar Telemetry Manifest (Width 295, right margin 35px) -->
  <g transform="translate(520, 40)">
    <!-- Header Box -->
    <rect x="0" y="0" width="295" height="32" rx="6" fill="#1e0c36" stroke="#f43f5e" stroke-width="1"/>
    <text x="147.5" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">
      ★ GEM TECH SONAR SCANNER ★
    </text>

    <!-- Telemetry Stats -->
    <text x="12" y="65" class="mono" font-size="11" fill="#fde047">STATUS: CONTINUOUS SWEEP</text>
    <text x="12" y="85" class="mono" font-size="11" fill="#ec4899">TARGET: BEACH CITY CLUSTER</text>
    <text x="12" y="105" class="mono" font-size="11" fill="#38bdf8">SHIELD RESONANCE: 100% NOMINAL</text>
    <text x="12" y="125" class="mono" font-size="11" fill="#c084fc">FUSION STABILITY: OPTIMAL</text>

    <line x1="0" y1="145" x2="295" y2="145" stroke="#381559" stroke-width="1"/>

    <!-- Legend -->
    <text x="2" y="172" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fbcfe8">GEM CONSTELLATION:</text>

    <circle cx="12" cy="195" r="5" fill="#fde047"/>
    <text x="26" y="199" class="mono" font-size="11" fill="#e9d5ff">Rose Shield / High Concurrency</text>

    <circle cx="12" cy="220" r="5" fill="#f43f5e"/>
    <text x="26" y="224" class="mono" font-size="11" fill="#e9d5ff">Garnet Backend / Distributed Locking</text>

    <circle cx="12" cy="245" r="5" fill="#a855f7"/>
    <text x="26" y="249" class="mono" font-size="11" fill="#e9d5ff">Amethyst Reactive UI &amp; Microservices</text>

    <circle cx="12" cy="270" r="5" fill="#38bdf8"/>
    <text x="26" y="274" class="mono" font-size="11" fill="#e9d5ff">Pearl Precision Architecture &amp; DevOps</text>

    <!-- Star Note -->
    <rect x="0" y="295" width="295" height="26" rx="6" fill="#1b082e" stroke="#db2777" stroke-width="0.8"/>
    <text x="147.5" y="312" class="sans" font-size="10.5" fill="#fef08a" text-anchor="middle" font-weight="600">
      "We will always find a way."
    </text>
  </g>
</svg>