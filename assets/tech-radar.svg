<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sweepGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="radarClip">
      <circle cx="300" cy="200" r="160"/>
    </clipPath>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes blipPulse { 0%, 70%, 100% { opacity: 0.5; r: 4; } 80% { opacity: 1; r: 7; } }
    @keyframes blipPulse2 { 0%, 50%, 100% { opacity: 0.4; r: 4; } 60% { opacity: 1; r: 7; } }
    @keyframes blipPulse3 { 0%, 30%, 100% { opacity: 0.4; r: 4; } 40% { opacity: 1; r: 7; } }
    @keyframes blipPulse4 { 0%, 10%, 100% { opacity: 0.4; r: 4; } 20% { opacity: 1; r: 7; } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.25; } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes legendPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    .sweep-arm { transform-origin: 300px 200px; animation: sweep 6s linear infinite; }
    .ring { animation: ringPulse 4s ease-in-out infinite; }
    .blip-core { animation: blipPulse 6s linear infinite; }
    .blip-prof { animation: blipPulse2 6s linear infinite; }
    .blip-expl { animation: blipPulse3 6s linear infinite; }
    .blip-core2 { animation: blipPulse4 6s linear infinite; }
    .legend-dot { animation: legendPulse 3s ease-in-out infinite; }
    .label { font-family: 'Courier New', monospace; font-size: 9px; fill: #8892b0; }
    .ring-label { font-family: 'Courier New', monospace; font-size: 10px; fill: #4a5568; letter-spacing: 1px; }
  </style>

  <!-- Background -->
  <rect width="800" height="400" fill="#060d18"/>

  <!-- Background grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Radar center at (300, 200) -->
  <!-- Cross hairs -->
  <line x1="140" y1="200" x2="460" y2="200" stroke="#14b8a6" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#14b8a6" stroke-width="0.5" opacity="0.15"/>
  <line x1="187" y1="87" x2="413" y2="313" stroke="#14b8a6" stroke-width="0.3" opacity="0.1"/>
  <line x1="413" y1="87" x2="187" y2="313" stroke="#14b8a6" stroke-width="0.3" opacity="0.1"/>

  <!-- Concentric rings -->
  <circle cx="300" cy="200" r="50" fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.2" class="ring"/>
  <circle cx="300" cy="200" r="100" fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.15" class="ring" style="animation-delay:0.5s"/>
  <circle cx="300" cy="200" r="155" fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.1" class="ring" style="animation-delay:1s"/>

  <!-- Ring labels -->
  <text x="300" y="157" text-anchor="middle" class="ring-label" opacity="0.4">CORE</text>
  <text x="300" y="108" text-anchor="middle" class="ring-label" opacity="0.35">PROFICIENT</text>
  <text x="300" y="55" text-anchor="middle" class="ring-label" opacity="0.3">EXPLORING</text>

  <!-- Sweep arm with cone -->
  <g class="sweep-arm" clip-path="url(#radarClip)">
    <!-- Sweep cone (triangle-like) -->
    <path d="M 300,200 L 300,40 L 380,40 Z" fill="url(#sweepGrad)" opacity="0.5"/>
    <path d="M 300,200 L 300,40 L 340,40 Z" fill="#06b6d4" opacity="0.15"/>
    <!-- Sweep line -->
    <line x1="300" y1="200" x2="300" y2="40" stroke="#06b6d4" stroke-width="2" filter="url(#sweepGlow)" opacity="0.8"/>
  </g>

  <!-- Tech blips - CORE (inner ring, r~40-50, green) -->
  <!-- JavaScript - top right of inner -->
  <circle cx="330" cy="170" r="5" fill="#22c55e" filter="url(#dotGlow)" class="blip-core" opacity="0.6"/>
  <text x="340" y="167" class="label" fill="#22c55e" opacity="0.7">JavaScript</text>

  <!-- Python - bottom left of inner -->
  <circle cx="270" cy="230" r="5" fill="#22c55e" filter="url(#dotGlow)" class="blip-core2" opacity="0.6"/>
  <text x="237" y="247" class="label" fill="#22c55e" opacity="0.7">Python</text>

  <!-- Java - left of inner -->
  <circle cx="260" cy="185" r="5" fill="#22c55e" filter="url(#dotGlow)" class="blip-core" opacity="0.6" style="animation-delay:1.5s"/>
  <text x="228" y="181" class="label" fill="#22c55e" opacity="0.7">Java</text>

  <!-- HTML/CSS - bottom right of inner -->
  <circle cx="335" cy="225" r="5" fill="#22c55e" filter="url(#dotGlow)" class="blip-core2" opacity="0.6" style="animation-delay:3s"/>
  <text x="345" y="230" class="label" fill="#22c55e" opacity="0.7">HTML/CSS</text>

  <!-- Tech blips - PROFICIENT (middle ring, r~80-100, blue) -->
  <!-- React -->
  <circle cx="370" cy="140" r="4" fill="#0ea5e9" filter="url(#dotGlow)" class="blip-prof" opacity="0.5"/>
  <text x="380" y="137" class="label" fill="#0ea5e9" opacity="0.7">React</text>

  <!-- Node.js -->
  <circle cx="220" cy="145" r="4" fill="#0ea5e9" filter="url(#dotGlow)" class="blip-prof" opacity="0.5" style="animation-delay:1s"/>
  <text x="185" y="141" class="label" fill="#0ea5e9" opacity="0.7">Node.js</text>

  <!-- Spring Boot -->
  <circle cx="210" cy="250" r="4" fill="#0ea5e9" filter="url(#dotGlow)" class="blip-prof" opacity="0.5" style="animation-delay:2s"/>
  <text x="165" y="262" class="label" fill="#0ea5e9" opacity="0.7">Spring Boot</text>

  <!-- PostgreSQL -->
  <circle cx="380" cy="270" r="4" fill="#0ea5e9" filter="url(#dotGlow)" class="blip-prof" opacity="0.5" style="animation-delay:3s"/>
  <text x="390" y="275" class="label" fill="#0ea5e9" opacity="0.7">PostgreSQL</text>

  <!-- Git -->
  <circle cx="395" cy="195" r="4" fill="#0ea5e9" filter="url(#dotGlow)" class="blip-prof" opacity="0.5" style="animation-delay:4s"/>
  <text x="405" y="198" class="label" fill="#0ea5e9" opacity="0.7">Git</text>

  <!-- Tech blips - EXPLORING (outer ring, r~130-155, yellow) -->
  <!-- Docker -->
  <circle cx="415" cy="110" r="4" fill="#eab308" filter="url(#dotGlow)" class="blip-expl" opacity="0.4"/>
  <text x="425" y="107" class="label" fill="#eab308" opacity="0.7">Docker</text>

  <!-- AWS -->
  <circle cx="170" cy="130" r="4" fill="#eab308" filter="url(#dotGlow)" class="blip-expl" opacity="0.4" style="animation-delay:1.5s"/>
  <text x="145" y="125" class="label" fill="#eab308" opacity="0.7">AWS</text>

  <!-- GraphQL -->
  <circle cx="170" cy="290" r="4" fill="#eab308" filter="url(#dotGlow)" class="blip-expl" opacity="0.4" style="animation-delay:3s"/>
  <text x="130" y="302" class="label" fill="#eab308" opacity="0.7">GraphQL</text>

  <!-- Kubernetes -->
  <circle cx="420" cy="310" r="4" fill="#eab308" filter="url(#dotGlow)" class="blip-expl" opacity="0.4" style="animation-delay:4.5s"/>
  <text x="430" y="315" class="label" fill="#eab308" opacity="0.7">Kubernetes</text>

  <!-- Center dot -->
  <circle cx="300" cy="200" r="3" fill="#06b6d4" filter="url(#dotGlow)" opacity="0.8"/>
  <circle cx="300" cy="200" r="1.5" fill="#fff" opacity="0.9"/>

  <!-- Legend panel on the right -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="210" height="240" rx="4" fill="#0a1628" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>

    <text x="105" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#06b6d4" letter-spacing="2" opacity="0.8">TECH RADAR</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#14b8a6" stroke-width="0.5" opacity="0.3"/>

    <!-- Core legend -->
    <circle cx="25" cy="60" r="5" fill="#22c55e" class="legend-dot" opacity="0.8"/>
    <text x="40" y="64" font-family="'Courier New', monospace" font-size="11" fill="#22c55e" opacity="0.8">Core</text>
    <text x="40" y="78" font-family="'Courier New', monospace" font-size="9" fill="#8892b0" opacity="0.6">Daily drivers, deep knowledge</text>

    <!-- Proficient legend -->
    <circle cx="25" cy="105" r="5" fill="#0ea5e9" class="legend-dot" opacity="0.8" style="animation-delay:0.5s"/>
    <text x="40" y="109" font-family="'Courier New', monospace" font-size="11" fill="#0ea5e9" opacity="0.8">Proficient</text>
    <text x="40" y="123" font-family="'Courier New', monospace" font-size="9" fill="#8892b0" opacity="0.6">Strong working knowledge</text>

    <!-- Exploring legend -->
    <circle cx="25" cy="150" r="5" fill="#eab308" class="legend-dot" opacity="0.8" style="animation-delay:1s"/>
    <text x="40" y="154" font-family="'Courier New', monospace" font-size="11" fill="#eab308" opacity="0.8">Exploring</text>
    <text x="40" y="168" font-family="'Courier New', monospace" font-size="9" fill="#8892b0" opacity="0.6">Learning &amp; experimenting</text>

    <line x1="15" y1="185" x2="195" y2="185" stroke="#14b8a6" stroke-width="0.5" opacity="0.2"/>

    <!-- Stats -->
    <text x="25" y="208" font-family="'Courier New', monospace" font-size="10" fill="#4a5568">Tracking:</text>
    <text x="105" y="208" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4">13 technologies</text>
    <text x="25" y="225" font-family="'Courier New', monospace" font-size="10" fill="#4a5568">Status:</text>
    <text x="105" y="225" font-family="'Courier New', monospace" font-size="10" fill="#14b8a6">SCANNING</text>
  </g>

  <!-- Outer border ring for radar -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.15"/>

  <!-- Corner accents -->
  <polyline points="5,15 5,5 15,5" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
  <polyline points="785,5 795,5 795,15" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <polyline points="5,385 5,395 15,395" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <polyline points="785,395 795,395 795,385" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
</svg>
